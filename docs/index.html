<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리서치 콘솔</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --paper:#fbfbf9; --card:#fff; --ink:#16191c; --ink-2:#5b6269; --ink-3:#8d949b;
  --rule:#e3e4e0; --accent:#0f6e56; --tintA:#eef4f1; --up:#1d7a4a; --down:#b3332e;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#14161a; --card:#1b1e23; --ink:#e8e9e6; --ink-2:#a2a8ae; --ink-3:#767c83;
         --rule:#2a2e34; --accent:#5dcaa5; --tintA:#1d2a26; --up:#5dc48a; --down:#e78078; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:2.5rem 1.25rem 4rem}
header{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
  flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:.9rem;margin-bottom:2rem}
h1{font-size:1.25rem;font-weight:600;margin:0;letter-spacing:-.01em}
.meta{font-size:.8rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
h2{font-size:.95rem;font-weight:600;margin:0 0 1rem;letter-spacing:-.005em}
section{margin-bottom:2.75rem}
.group{border-top:1px solid var(--rule);padding:1.15rem 0}
.group:first-of-type{border-top:none;padding-top:0}
.ghead{display:flex;align-items:center;gap:.5rem;margin-bottom:.7rem;flex-wrap:wrap}
.gname{font-size:.95rem;font-weight:600}
.tag{font-size:.78rem;font-weight:600;color:var(--accent)}
.pill{font-size:.68rem;color:var(--ink-3);border:1px solid var(--rule);
  border-radius:999px;padding:.05rem .45rem}
.pill.on{color:var(--accent);border-color:var(--accent);background:var(--tintA)}
article{padding:.42rem 0}
article a{color:var(--ink);text-decoration:none;font-size:.92rem;
  border-bottom:1px solid transparent}
article a:hover,article a:focus-visible{border-bottom-color:var(--accent);color:var(--accent)}
.sum{font-size:.82rem;color:var(--ink-2);margin:.12rem 0 0}
.src{font-size:.72rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.more{margin-top:.5rem;background:none;border:1px solid var(--rule);color:var(--ink-2);
  border-radius:999px;padding:.22rem .8rem;font-size:.76rem;cursor:pointer;
  font-family:inherit}
.more:hover{border-color:var(--accent);color:var(--accent)}
.hidden{display:none}
.reports{background:var(--card);border:1px solid var(--rule);border-radius:9px;
  padding:.7rem .9rem;margin-top:.7rem}
.reports .cap{font-size:.72rem;color:var(--ink-3);margin:0 0 .35rem}
.reports article{padding:.28rem 0}
.reports a{font-size:.86rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:.75rem}
.slot{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:1rem}
.slot h3{font-size:.85rem;font-weight:600;margin:0 0 .3rem}
.slot p{font-size:.78rem;color:var(--ink-3);margin:0}
.note{font-size:.82rem;color:var(--ink-3)}
table{width:100%;border-collapse:collapse;font-size:.82rem;
  font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:500;color:var(--ink-3);font-size:.72rem;
  padding:.3rem .4rem;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:.34rem .4rem;border-bottom:1px solid var(--rule)}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:none}
.tick{font-weight:600}
.hit{color:var(--accent);font-weight:600}
.miss{color:var(--ink-3);font-size:.74rem}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.sub{font-size:.8rem;font-weight:600;margin:1.3rem 0 .5rem}
.sub:first-child{margin-top:0}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}
.chip{font-size:.72rem;color:var(--ink-2);background:var(--card);
  border:1px solid var(--rule);border-radius:999px;padding:.12rem .55rem}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>리서치 콘솔</h1>
  <span class="meta" id="stamp">불러오는 중</span>
</header>

<section>
  <h2>오늘의 종목</h2>
  <div id="stocks"><p class="note">불러오는 중입니다.</p></div>
</section>

<section>
  <h2>스크리너 결과</h2>
  <div id="tables"><p class="note">불러오는 중입니다.</p></div>
</section>

<section>
  <h2>준비 중인 패널</h2>
  <div class="grid">
    <div class="slot"><h3>포트폴리오 · 룰 트리거</h3><p>보유 종목과 SPY 낙폭 기준선</p></div>
    <div class="slot"><h3>관심종목 수급</h3><p>외국인·기관 20일 누적</p></div>
    <div class="slot"><h3>K-뷰티 수출 레이더</h3><p>관세청 순별 통계</p></div>
  </div>
</section>

<section>
  <h2>섹터 뉴스</h2>
  <div id="sectors"><p class="note">불러오는 중입니다.</p></div>
</section>

</div>

<script>
const SHOW = 5;   // 처음 보여줄 건수. 나머지는 더보기로 펼친다

const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const ago = iso => {
  if (!iso) return "";
  const h = (Date.now() - new Date(iso)) / 36e5;
  if (h < 1) return "방금";
  if (h < 24) return Math.round(h) + "시간 전";
  return Math.round(h / 24) + "일 전";
};

const newsItem = (it, i) => `
  <article class="${i < SHOW ? "" : "extra hidden"}">
    <a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>
    ${it.summary ? `<p class="sum">${esc(it.summary)}</p>` : ""}
    <span class="src">${esc(it.source)} · ${ago(it.published)}${
      it.dup_count ? " · 유사 " + it.dup_count : ""}</span>
  </article>`;

const moreBtn = n => n > SHOW
  ? `<button class="more" data-rest="${n - SHOW}">더보기 ${n - SHOW}건</button>` : "";

const reportBlock = rows => !rows || !rows.length ? "" : `
  <div class="reports">
    <p class="cap">리포트 · 목표주가</p>
    ${rows.map(r => `
      <article>
        <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>
        <span class="src">${esc(r.broker)}${r.date ? " · " + esc(r.date) : ""}</span>
      </article>`).join("")}
  </div>`;

function bindMore(root) {
  root.querySelectorAll(".more").forEach(btn => {
    btn.addEventListener("click", () => {
      const box = btn.closest(".group");
      box.querySelectorAll(".extra").forEach(el => el.classList.remove("hidden"));
      btn.remove();
    });
  });
}

const nz = v => (v === null || v === undefined || v === "") ? "—" : v;

function renderTables(t) {
  const box = document.getElementById("tables");
  if (!t) { box.innerHTML = '<p class="note">tables.json 이 아직 없습니다.</p>'; return; }

  const bo = (t.breakout || []).map(r => `
    <tr>
      <td class="tick">${esc(r.code)}</td>
      <td>${esc((r.name || "").slice(0, 22))}</td>
      <td class="n">${nz(r.score)}</td>
      <td class="n">${r.gates >= 3 ? `<span class="hit">${r.gates}</span>` : nz(r.gates)}</td>
      <td class="n">${nz(r.drawdown)}%</td>
      <td class="miss">${esc(r.missing || "—")}</td>
    </tr>`).join("");

  const dv = (t.deepvalue || []).map(r => `
    <tr>
      <td class="tick">${esc(r.code)}${r.triggered ? ' <span class="hit">•</span>' : ""}</td>
      <td>${esc((r.name || "").slice(0, 22))}</td>
      <td class="n">${nz(r.score)}</td>
      <td class="n">${nz(r.fscore)}</td>
      <td class="n">${nz(r.drawdown)}%</td>
      <td class="n">${nz(r.below200)}</td>
      <td class="miss">${esc(r.why || "—")}</td>
    </tr>`).join("");

  const hist = (t.history || []).slice(-10).map(h => `
    <tr>
      <td>${esc(h.date.slice(5))}</td>
      <td class="n">${h.highs}</td>
      <td class="n">${h.gate3}</td>
      <td class="n">${h.buyable}</td>
      <td class="n">${h.dv_triggered}</td>
    </tr>`).join("");

  const chips = (t.rejects || []).slice(0, 6)
    .map(([k, v]) => `<span class="chip">${esc(k)} ${v}</span>`).join("");

  box.innerHTML = `
    <p class="sub">신고가 · 물극필반 <span class="miss">게이트 3개 이상이 후보</span></p>
    <div class="scroll"><table>
      <tr><th>티커</th><th>종목</th><th class="n">점수</th><th class="n">게이트</th>
          <th class="n">낙폭</th><th>못 넘은 항목</th></tr>
      ${bo || '<tr><td colspan="6" class="note">해당 없음</td></tr>'}
    </table></div>

    <p class="sub">딥밸류 <span class="miss">• 는 오늘 트리거 발생</span></p>
    <div class="scroll"><table>
      <tr><th>티커</th><th>종목</th><th class="n">점수</th><th class="n">F</th>
          <th class="n">낙폭</th><th class="n">200일선아래</th><th>왜 싼가</th></tr>
      ${dv || '<tr><td colspan="7" class="note">해당 없음</td></tr>'}
    </table></div>

    <p class="sub">통과 추이</p>
    <div class="scroll"><table>
      <tr><th>날짜</th><th class="n">신고가</th><th class="n">게이트3+</th>
          <th class="n">매수가능</th><th class="n">딥밸류트리거</th></tr>
      ${hist || '<tr><td colspan="5" class="note">기록 없음</td></tr>'}
    </table></div>

    <p class="sub">다 걸러낸 조건</p>
    <div class="chips">${chips || '<span class="note">집계 없음</span>'}</div>`;
}

Promise.all([
  fetch("data/news.json?t=" + Date.now()).then(r => r.json()),
  fetch("data/research.json?t=" + Date.now()).then(r => r.json()).catch(() => null),
  fetch("data/tables.json?t=" + Date.now()).then(r => r.json()).catch(() => null),
]).then(([news, research, tables]) => {
  renderTables(tables);
  document.getElementById("stamp").textContent =
    new Date(news.updated_at).toLocaleString("ko-KR",
      { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" })
    + " · " + news.total + "건";

  const byCode = {};
  (research?.stocks || []).forEach(s => { byCode[s.code] = s.items; });

  const stockBox = document.getElementById("stocks");
  const stocks = (news.stocks || []).filter(s => s.items.length || byCode[s.code]?.length);
  stockBox.innerHTML = stocks.length ? stocks.map(s => `
    <div class="group">
      <div class="ghead">
        <span class="gname">${esc(s.name)}</span>
        <span class="pill">${esc(s.code)}</span>
        ${s.source ? `<span class="pill on">${esc(s.source)}</span>` : ""}
        ${s.note ? `<span class="pill">${esc(s.note)}</span>` : ""}
      </div>
      ${s.items.map(newsItem).join("")}
      ${moreBtn(s.items.length)}
      ${reportBlock(byCode[s.code])}
    </div>`).join("")
    : '<p class="note">picks.json 이 비어 있습니다. Actions 에서 수집을 한 번 실행하세요.</p>';

  const sectorBox = document.getElementById("sectors");
  const live = (news.sectors || []).filter(s => s.items.length);
  sectorBox.innerHTML = live.length ? live.map(s => `
    <div class="group">
      <div class="ghead">
        <span class="tag">${esc(s.name)}</span>
        ${s.push ? '<span class="pill">알림</span>' : ""}
      </div>
      ${s.items.map(newsItem).join("")}
      ${moreBtn(s.items.length)}
    </div>`).join("")
    : '<p class="note">최근 기사가 없습니다. 검색어를 넓혀 보세요.</p>';

  bindMore(document);
}).catch(() => {
  document.getElementById("stamp").textContent = "데이터 없음";
  document.getElementById("stocks").innerHTML =
    '<p class="note">data/news.json 을 찾지 못했습니다. Actions 탭에서 수집을 실행하세요.</p>';
  document.getElementById("sectors").innerHTML = "";
});
</script>
</body>
</html>
