
name: 대시보드 갱신

on:
  schedule:
    # UTC 기준입니다. 한국시간 평일 아침 8시와 저녁 6시 반, 하루 두 번.
    # 스크리너가 2,000종목을 훑기 때문에 매시간 돌리지 않습니다.
    - cron: "0 23 * * 0-4"
    - cron: "30 9 * * 1-5"
  workflow_dispatch:        # 저장소 Actions 탭에서 손으로도 돌릴 수 있습니다

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 가격 캐시 복원
        uses: actions/cache@v4
        with:
          path: screener/us_px_cache.pkl.gz
          key: px-cache-${{ github.run_id }}
          restore-keys: px-cache-

      - name: 신고가 스크리너
        run: python scripts/us_breakout.py -w screener -u SPX NDX R2K

      - name: 재무 캐시 복원
        uses: actions/cache@v4
        with:
          path: dv_cache
          key: dv-cache-${{ github.run_id }}
          restore-keys: dv-cache-

      - name: 딥밸류 스크리너
        # 재무 데이터를 종목마다 받아야 해서 느립니다.
        # 우선 spx 로 시작하고, 안정되면 --universe all 로 넓히세요.
        run: python scripts/deepvalue/dv_run.py --universe spx --out screener/outputs
        continue-on-error: true

      - name: 오늘의 종목 선정
        run: python scripts/make_picks.py

      - name: 결과 표 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/make_tables.py

      - name: 뉴스 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch_news.py

      - name: 리포트 링크 수집
        run: python scripts/fetch_research.py

      - name: 텔레그램 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/push_telegram.py

      - name: 결과 커밋
        run: |
          git config user.name "dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data
          git diff --staged --quiet || git commit -m "뉴스 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
